<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14161a">
<title>Золотая заявка — досье геймдизайнера для Vizor Games</title>
<meta name="description" content="Резюме-досье в нуарной стилистике: карта дела, депеши и живой тюнер лайвопс-события. Один файл, ноль сетевых запросов.">
<style>
:root{
  --desk:#14161a; --paper:#ddd3bd; --ink:#2a251d; --stamp:#a33c2e; --grey:#8b8f97;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--desk)}
body{font-family:'PT Mono','Courier New',monospace;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app canvas{display:block;touch-action:none}
#loader{position:fixed;inset:0;background:var(--desk);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;z-index:10;transition:opacity .4s}
#loader .case{color:var(--paper);font-size:13px;letter-spacing:6px}
#loader .stamp{border:3px solid var(--stamp);color:var(--stamp);padding:3px 10px;
  font-size:11px;letter-spacing:4px;transform:rotate(9deg);opacity:.85}
#loader .bar{width:min(46vw,260px);height:10px;border:1px solid #55595f;background:#101216;overflow:hidden}
#loader .bar i{display:block;height:100%;width:8%;
  background:repeating-linear-gradient(45deg,var(--stamp) 0 4px,#7c2f24 4px 8px);transition:width .25s}
#loader p{color:var(--grey);font-size:12px;letter-spacing:1px}
{{FONTS_CSS}}
</style>
</head>
<body>
<div id="app"></div>
<div id="loader">
  <div class="stamp">К РАССМОТРЕНИЮ</div>
  <div class="case">ДЕЛО № ВЗ-7</div>
  <div class="bar"><i id="loader-fill"></i></div>
  <p id="loader-text">открываем архив…</p>
</div>
<script>
window.__errors = [];
window.addEventListener('error', e => window.__errors.push(String(e.message) + ' @' + (e.filename||'') + ':' + e.lineno));
window.addEventListener('unhandledrejection', e => window.__errors.push('REJ: ' + String(e.reason && e.reason.stack || e.reason).slice(0, 400)));
</script>
<script>{{PIXI_JS}}</script>
<script>{{GAME_JS}}</script>
</body>
</html>
